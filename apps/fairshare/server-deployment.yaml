apiVersion: apps/v1
kind: Deployment

metadata:
  name: fairshare-server
  namespace: nonprod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fairshare-server

  template:
    metadata:
      labels:
        app: fairshare-server

    spec:
      containers:
        - name: fairshare-server
          image: ghcr.io/taku10/fairshare-server:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/firebase/service-account.json

            - name: GOOGLE_CLOUD_PROJECT
              value: fareshare-20b22

            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: fairshare-secrets
                  key: MONGO_URI

          volumeMounts:
            - name: firebase-admin
              mountPath: /var/run/secrets/firebase
              readOnly: true

      volumes:
        - name: firebase-admin
          secret:
            secretName: fairshare-firebase-admin