apiVersion: apps/v1
kind: Deployment
metadata:
  name: fruitku
  labels:
    app.kubernetes.io/name: fruitku
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: fruitku
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fruitku
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fruitku
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: fruitku
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fruitku
          image: ghcr.io/taku10/fruitku:0.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fruitku-runtime
                  key: STRIPE_SECRET_KEY
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: temporary-files
          emptyDir: {}
