apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: fairshare
  namespace: prod
spec:
  ingressClassName: traefik
  rules:
  - host: fairshare.takunda.cloud
    http:
      paths:
      - backend:
          service:
            name: fairshare-client
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - fairshare.takunda.cloud
    secretName: fairshare-tls
