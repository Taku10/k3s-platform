apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-nonprod
  namespace: argocd
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/instance: portfolio-nonprod
    app.kubernetes.io/part-of: portfolio
    platform.takunda.cloud/environment: nonprod
    platform.takunda.cloud/category: workload
spec:
  project: default
  source:
    repoURL: https://github.com/Taku10/k3s-platform.git
    targetRevision: main
    path: apps/portfolio/overlays/nonprod
  destination:
    server: https://kubernetes.default.svc
    namespace: nonprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
