            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(traefik_service_requests_total{service=~\"prod-portfolio-80@kubernetes.*\"}[24h]))",
              "legendFormat": "Requests",
              "range": true
            }
          ]
        },
        {
          "id": 6,
          "title": "FruitKu requests — 24h",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
