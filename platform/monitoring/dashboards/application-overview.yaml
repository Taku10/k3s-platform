          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(kube_deployment_status_replicas_available{namespace=\"prod\",deployment=~\"fruitku\"} / clamp_min(kube_deployment_spec_replicas{namespace=\"prod\",deployment=~\"fruitku\"}, 1))",
