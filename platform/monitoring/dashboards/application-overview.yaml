        {
          "id": 11,
          "title": "What this dashboard means",
          "type": "text",
          "gridPos": {
            "h": 5,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "options": {
            "content": "### Plain-language guide\n- **Status** shows whether every requested production replica is available.\n- **Requests** counts traffic, not unique people.\n- **Successful requests** excludes server errors.\n- **Response time** shows how quickly most requests finish.\n- **Server errors** and **container restarts** should normally stay at zero.\n\nBusiness events such as households, chores, orders and resume downloads require application instrumentation and are intentionally not estimated here.",
            "mode": "markdown"
          }
        }
