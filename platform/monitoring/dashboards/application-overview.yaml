          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"prod-fairshare-client-80@kubernetes.*\"}[$__rate_interval])))",
              "legendFormat": "FairShare",
              "range": true
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"prod-portfolio-80@kubernetes.*\"}[$__rate_interval])))",
              "legendFormat": "Portfolio",
              "range": true
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~\"prod-fruitku-80@kubernetes.*\"}[$__rate_interval])))",
              "legendFormat": "FruitKu",
              "range": true
            }
          ]
        },
