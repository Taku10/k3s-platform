        },
        {
          "id": 4,
          "title": "FairShare requests — 24h",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Requests served during the last 24 hours. This is traffic, not unique visitors.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd"
              },
              "decimals": 0,
              "noValue": "No traffic",
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(traefik_service_requests_total{service=~\"prod-fairshare-client-80@kubernetes.*\"}[24h]))",
              "legendFormat": "Requests",
              "range": true
            }
          ]
        },
        {
          "id": 5,
          "title": "Portfolio requests — 24h",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Requests served during the last 24 hours. This is traffic, not unique visitors.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd"
              },
