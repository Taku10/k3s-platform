apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-application-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: monitoring
data:
  application-overview.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "id": 1,
          "title": "FairShare status",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Whether the FairShare production deployment has all requested replicas available.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "from": 0,
                    "to": 0.989,
                    "result": {
                      "color": "red",
                      "text": "Unavailable"
                    }
                  },
                  "type": "range"
                },
                {
                  "options": {
                    "from": 0.99,
                    "to": 1.01,
                    "result": {
                      "color": "green",
                      "text": "Healthy"
                    }
                  },
                  "type": "range"
                }
              ],
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(kube_deployment_status_replicas_available{namespace=\"prod\",deployment=~\"fairshare-client|fairshare-server\"} / clamp_min(kube_deployment_spec_replicas{namespace=\"prod\",deployment=~\"fairshare-client|fairshare-server\"}, 1))",
              "legendFormat": "FairShare",
              "range": true
            }
          ]
        },
        {
          "id": 2,
          "title": "Portfolio status",
