            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"prod\",pod=~\"(fairshare-client|fairshare-server)-.*\"}[24h]))",
              "legendFormat": "FairShare",
              "range": true
            },
            {
              "refId": "B",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"prod\",pod=~\"(portfolio)-.*\"}[24h]))",
