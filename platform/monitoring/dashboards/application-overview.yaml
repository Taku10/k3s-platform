            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(kube_deployment_status_replicas_available{namespace=\"prod\",deployment=~\"portfolio\"} / clamp_min(kube_deployment_spec_replicas{namespace=\"prod\",deployment=~\"portfolio\"}, 1))",
              "legendFormat": "Portfolio",
              "range": true
