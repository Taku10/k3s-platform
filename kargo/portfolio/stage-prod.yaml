apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: portfolio
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: portfolio
      sources:
        stages:
          - nonprod
        requiredSoakTime: 5m
  promotionTemplate:
    spec:
      steps:
        - task:
            name: promote-portfolio
          as: promote-portfolio
